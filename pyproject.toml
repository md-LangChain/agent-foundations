[project]
name = "agent-foundations"
version = "0.1.0"
description = "Agent Foundations workshop: LangChain agents to Deep Agents"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7",
    "ipython>=9.6.0",
    "ipywidgets>=8.1.0",
    "jupyter>=1.1.1",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.0.1",
    "langgraph>=1.2.10",
    "langsmith>=0.10.13",
    "notebook>=7.4.7",
    "python-dotenv>=1.1.1",
]

[tool.setuptools]
packages = ["utils"]
